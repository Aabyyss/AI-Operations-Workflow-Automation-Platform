services:
  aiops-api:
    build: .
    container_name: aiops-api
    ports:
      - "8000:8000"
    environment:
      - AIOPS_MODE=${AIOPS_MODE:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AIOPS_CHAT_MODEL=${AIOPS_CHAT_MODEL:-gpt-4o-mini}
      # ---- model routing (inert until set; empty follows the chat model) ----
      - AIOPS_LIGHT_MODEL=${AIOPS_LIGHT_MODEL:-}
      - AIOPS_HEAVY_MODEL=${AIOPS_HEAVY_MODEL:-}
      - AIOPS_EMBED_MODEL=${AIOPS_EMBED_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # ---- security (all off by default) ----
      - AIOPS_API_KEY=${AIOPS_API_KEY:-}
      - AIOPS_APPROVER_KEY=${AIOPS_APPROVER_KEY:-}
      - AIOPS_ADMIN_KEY=${AIOPS_ADMIN_KEY:-}
      - AIOPS_SHADOW=${AIOPS_SHADOW:-0}
      - AIOPS_RECEIPT_KEY=${AIOPS_RECEIPT_KEY:-}
      - AIOPS_RECEIPT_KEY_MAX_AGE_DAYS=${AIOPS_RECEIPT_KEY_MAX_AGE_DAYS:-}
      - AIOPS_WEBHOOK_SECRET=${AIOPS_WEBHOOK_SECRET:-}
      - AIOPS_RATE_LIMIT=${AIOPS_RATE_LIMIT:-0}
      - AIOPS_RATE_LIMIT_WINDOW_S=${AIOPS_RATE_LIMIT_WINDOW_S:-}
      - AIOPS_WEBHOOK_MAX_SKEW_S=${AIOPS_WEBHOOK_MAX_SKEW_S:-}
      # ---- governance thresholds (the ladder in docs/GOVERNANCE.md) ----
      # Every one of these is a governance decision; see OPERATIONS §1.
      - AIOPS_AUTO_EXECUTE_MAX_RISK=${AIOPS_AUTO_EXECUTE_MAX_RISK:-}
      - AIOPS_BLOCK_MIN_RISK=${AIOPS_BLOCK_MIN_RISK:-}
      - AIOPS_MONETARY_APPROVAL_LIMIT_USD=${AIOPS_MONETARY_APPROVAL_LIMIT_USD:-}
      - AIOPS_MIN_RETRIEVAL_SCORE=${AIOPS_MIN_RETRIEVAL_SCORE:-}
      - AIOPS_MIN_AUTO_CONFIDENCE=${AIOPS_MIN_AUTO_CONFIDENCE:-}
      # ---- economics ----
      - AIOPS_MONTHLY_BUDGET_USD=${AIOPS_MONTHLY_BUDGET_USD:-}
      # ---- outbound delivery (empty = outbox stays a durable queue) ----
      - AIOPS_OUTBOX_URL=${AIOPS_OUTBOX_URL:-}
      - AIOPS_OUTBOX_SECRET=${AIOPS_OUTBOX_SECRET:-}
      # ---- backups (scripts/backup.py) ----
      # Default lands on ./data_backups via the mount below: a snapshot
      # inside the container is not a backup, it is the same single disk.
      - AIOPS_BACKUP_DIR=${AIOPS_BACKUP_DIR:-/app/data_backups}
      # ---- observability ----
      - AIOPS_REQUEST_LOG_FILE=${AIOPS_REQUEST_LOG_FILE:-}
      - AIOPS_LOG_FORMAT=${AIOPS_LOG_FORMAT:-}
      - AIOPS_API_BASE_URL=${AIOPS_API_BASE_URL:-}
      # ---- storage (json default; postgres via the profile below) ----
      - AIOPS_STORAGE=${AIOPS_STORAGE:-json}
      - AIOPS_DATABASE_URL=${AIOPS_DATABASE_URL:-postgresql://aiops:aiops@postgres:5432/aiops}
      # AIOPS_DATA_DIR is deliberately NOT passed through: inside the
      # container the path is fixed by the ./data:/app/data mount below, and
      # setting it from .env would write outside the mounted volume — data
      # that survives `docker compose down` only exists under ./data.
    volumes:
      - ./data:/app/data
      - ./data_backups:/app/data_backups
      - ./knowledge_base:/app/knowledge_base
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: aiops-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
    volumes:
      - n8n_data:/home/node/.n8n

  # ------------------------------------------------------------------
  # Optional Postgres storage backend — `docker compose --profile postgres up`
  # Then: AIOPS_STORAGE=postgres, AIOPS_DATABASE_URL=postgresql://aiops:aiops@postgres:5432/aiops
  # Migrate existing JSON data:  python -m scripts.migrate_to_postgres --dsn ... --replace --verify
  # ------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiops-postgres
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=aiops
      - POSTGRES_PASSWORD=aiops
      - POSTGRES_DB=aiops
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  n8n_data:
  pg_data:
