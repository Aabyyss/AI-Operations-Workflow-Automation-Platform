name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — saves runner minutes and keeps
# the Actions tab readable during rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One Python version failing must never cancel the others — partial
      # results are how version-specific bugs get misdiagnosed.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run test suite
        env:
          AIOPS_MODE: mock
        run: python -m pytest -v
      - name: Verify the committed one-pager has not drifted
        run: python -m scripts.cost_onepager --verify
      - name: Smoke-test API boot
        run: |
          uvicorn backend.main:app --port 8077 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8077/health && break || sleep 1
          done
          curl -sf http://localhost:8077/health | grep -q '"status":"ok"'
          RESP=$(curl -sf -X POST http://localhost:8077/api/tickets/demo)
          echo "$RESP" | grep -q '"disposition":"auto_resolved"'
          RUN=$(echo "$RESP" | python -c "import json,sys; print(json.load(sys.stdin)['id'])")
          curl -sf -o /tmp/receipt.json "http://localhost:8077/api/runs/$RUN/receipt.json"
          python -m scripts.verify_receipt /tmp/receipt.json

  eval-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Quality eval — routing accuracy + escalation recall vs governance labels
        env:
          AIOPS_MODE: mock
        run: python -m scripts.eval_quality

  visual:
    # The dashboard's look is an artifact like any other: this job fails when
    # a card disappears, a design token changes, or a section reorders. It
    # records on ubuntu-latest while the committed baseline was recorded on
    # the maintainer's machine, so it runs --allow-cross-platform, which
    # compares tokens, headings and card inventory exactly and skips the
    # pixel/geometry comparison those do not survive. A capture of the real
    # pixels is uploaded when the job fails, so the reviewer sees the page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright-core
          npx playwright-core install --with-deps chromium
      - name: Visual check — tokens, headings and card inventory vs docs/screenshots
        env:
          AIOPS_MODE: mock
        run: python -m scripts.visual_check --allow-cross-platform --capture-dir build/visual
      - name: Keep the capture that failed the check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-capture
          path: build/visual
          if-no-files-found: warn
