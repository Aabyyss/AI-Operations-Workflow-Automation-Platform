name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — saves runner minutes and keeps
# the Actions tab readable during rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One Python version failing must never cancel the others — partial
      # results are how version-specific bugs get misdiagnosed.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run test suite
        env:
          AIOPS_MODE: mock
        run: python -m pytest -v
      - name: Verify the committed one-pager has not drifted
        run: python -m scripts.cost_onepager --verify
      - name: Smoke-test API boot
        run: |
          uvicorn backend.main:app --port 8077 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8077/health && break || sleep 1
          done
          curl -sf http://localhost:8077/health | grep -q '"status":"ok"'
          RESP=$(curl -sf -X POST http://localhost:8077/api/tickets/demo)
          echo "$RESP" | grep -q '"disposition":"auto_resolved"'
          RUN=$(echo "$RESP" | python -c "import json,sys; print(json.load(sys.stdin)['id'])")
          curl -sf -o /tmp/receipt.json "http://localhost:8077/api/runs/$RUN/receipt.json"
          python -m scripts.verify_receipt /tmp/receipt.json

      - name: Backup round-trip — snapshot, verify, restore
        run: |
          python -m scripts.backup --retention 2
          SNAP=$(ls -t data_backups/*.tar.gz | head -1)
          python -m scripts.backup --verify "$SNAP"
          rm -rf /tmp/restored
          python -m scripts.backup --snapshot "$SNAP" --restore-to /tmp/restored
          test -f /tmp/restored/runs.json

  eval-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Quality eval — routing accuracy + escalation recall vs governance labels
        env:
          AIOPS_MODE: mock
        run: python -m scripts.eval_quality

  visual:
    # The dashboard's look is an artifact like any other: this job fails when
    # a card disappears, a design token changes, or a section reorders — and,
    # once a baseline recorded on this runner is committed, when a pixel or a
    # card box moves too.
    #
    # Baselines are per platform (fonts and the rasteriser differ), and a
    # Linux baseline cannot be invented by a Windows machine. So the first
    # run records one from the runner itself: it still gates tokens, headings
    # and inventory against the committed baseline, mints the Linux baseline,
    # and hands it back as an artifact to commit as docs/screenshots/linux/.
    # Every run after that compares pixels and geometry in full.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright-core
          npx playwright-core install --with-deps chromium
      - name: Is there a baseline recorded on this runner?
        id: baseline
        run: |
          if [ -f docs/screenshots/linux/layout-baseline.json ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
            echo "No Linux baseline committed yet — this run will record one."
          fi
      - name: Visual check — pixels, geometry, tokens and inventory
        if: steps.baseline.outputs.mode == 'full'
        env:
          AIOPS_MODE: mock
        run: python -m scripts.visual_check --capture-dir build/visual --report build/visual/report.json
      - name: Record the runner's baseline, and gate what still transfers
        if: steps.baseline.outputs.mode == 'bootstrap'
        env:
          AIOPS_MODE: mock
        run: |
          # Order matters: the cross-platform check runs first, so real token
          # or inventory drift still fails this job. Only a run that passed
          # gets to mint a baseline — a gate must not quietly adopt whatever
          # it just failed to compare.
          python -m scripts.visual_check --allow-cross-platform --capture-dir build/visual --report build/visual/report.json
          python -m scripts.visual_check --update --current build/visual
          echo "::warning::No baseline was recorded on linux — one was recorded this run. Commit the visual-baseline-linux artifact as docs/screenshots/linux/ to turn on the pixel and geometry comparison."
      - name: Hand back the baseline this runner recorded
        if: steps.baseline.outputs.mode == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-linux
          path: docs/screenshots/linux
          if-no-files-found: error
      - name: Keep the capture that failed the check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-capture
          path: build/visual
          if-no-files-found: warn
      - name: Keep the verdict on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: build/visual/report.json
          if-no-files-found: warn
